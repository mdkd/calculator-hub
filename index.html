<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free online calculators for finance, math, date & time, word tools, health, unit conversion, education, and business — organized by section, fast and easy to use."
    />
    <title>Calculator Hub — Free Online Calculators</title>

    <!--
      SITE VERIFICATION — paste ownership-verification meta tags here (each service
      gives you one <meta> tag to drop in, no other changes needed), e.g.:

      Google Search Console:
      <meta name="google-site-verification" content="YOUR_CODE_HERE" />

      Google AdSense:
      <meta name="google-adsense-account" content="ca-pub-XXXXXXXXXXXXXXXX" />

      Bing Webmaster Tools:
      <meta name="msvalidate.01" content="YOUR_CODE_HERE" />
    -->

    <!--
      GOOGLE ANALYTICS (GA4) — uncomment and replace G-XXXXXXXXXX with the real
      measurement ID (see VITE_GA_MEASUREMENT_ID in .env.example) to enable tracking:

      <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
      </script>
    -->

    <!--
      GOOGLE ADSENSE — uncomment and replace ca-pub-XXXXXXXXXXXXXXXX with the real
      client ID once the site is approved, then set VITE_ADS_ENABLED=true and
      VITE_ADSENSE_CLIENT_ID in .env.local so the <AdSlot /> components (see
      src/components/AdSlot.jsx) switch from placeholders to real ad units:

      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
